[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-lead-intelligence-engine"
version = "0.2.0"
description = "Synthetic automotive lead ranking baseline for sales decision support"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0", "joblib==1.5.3", "scipy==1.17.0", "threadpoolctl==3.6.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
lead-experiment = "lead_intelligence.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
